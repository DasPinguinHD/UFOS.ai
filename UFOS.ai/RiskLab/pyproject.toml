[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risklab"
version = "0.7.0"
description = "Bank-style market-risk lab: VaR / ES estimation and backtesting (UFOS.ai)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
# figures for the validation report (report/build_figures.py, report/build_report.py)
report = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
