[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risklab"
version = "0.1.0"
description = "Bank-style market-risk lab: VaR / ES estimation and backtesting (UFOS.ai)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]
