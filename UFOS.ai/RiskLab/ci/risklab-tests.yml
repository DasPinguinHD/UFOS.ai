# Risk Lab unit tests. Prepared here because .github/ is protected:
# copy this file to .github/workflows/risklab-tests.yml to activate it.
name: risklab-tests

on:
  push:
    paths:
      - "UFOS.ai/RiskLab/**"
  pull_request:
    paths:
      - "UFOS.ai/RiskLab/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: UFOS.ai/RiskLab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # Switch to `pip install --require-hashes -r requirements.txt` once the lock exists.
        run: python -m pip install -r requirements.in
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -t . -v
