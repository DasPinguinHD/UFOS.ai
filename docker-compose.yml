# UFOS.ai is a proof-of-concept portfolio project, not a published product.
version: '3.8'
services:
  backend:
    build: ./UFOS.ai/LiveStreamAgent/backend
    container_name: livestreamagent_backend
    # Inside the container the backend must listen on 0.0.0.0 (explicit opt-in,
    # see api_auth.py); on the host the ports are published on loopback only.
    ports:
      - "127.0.0.1:8765:8765"
      - "127.0.0.1:8766:8766"
    environment:
      - PYTHONUNBUFFERED=1
      - WS_HOST=0.0.0.0
      - HTTP_HOST=0.0.0.0
      - ALLOW_REMOTE_ACCESS=true
    volumes:
      - ./UFOS.ai/LiveStreamAgent/backend:/app
    restart: unless-stopped
