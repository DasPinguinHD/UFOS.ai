# Risk Lab tests. Prepared here because .github/ is protected:
# copy this file to .github/workflows/risklab-tests.yml to activate it.
# Dependencies come from the hash-pinned lock (requirements-report.lock = core + the "report" extra,
# so the figure tests run too); pip refuses any file whose hash is not in the lock.
# Every run step is a YAML block scalar (`run: |`), so options such as `--only-binary=:all:` are safe.
# The actions are pinned by commit SHA (resolved with `git ls-remote` on 2026-11-06):
#   actions/checkout v4.4.0, actions/setup-python v5.6.0.
name: risklab-tests

on:
  push:
    paths:
      - "UFOS.ai/RiskLab/**"
  pull_request:
    paths:
      - "UFOS.ai/RiskLab/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    defaults:
      run:
        working-directory: UFOS.ai/RiskLab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the locked dependencies (hash-checked)
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-report.lock
      - name: Run the unit tests
        run: |
          python -m unittest discover -s tests -t . -v
      - name: Run the quickstart example
        run: |
          python examples/quickstart.py
      - name: Run every study in smoke mode
        run: |
          for s in var_backtest_power horizon_10d estimation_window survivorship gate_overfitting; do
            python studies/$s.py --mode smoke --quiet --out-dir "$RUNNER_TEMP/$s"
          done
